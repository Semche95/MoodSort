# Release notes generated by git-cliff from the Conventional Commits since the previous tag (see .github/workflows/release.yml).
# Changes visible to users come first, then the internal ones worth mentioning; dependency bumps and the rest are left out.

[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.breaking %}**Breaking:** {% endif %}{% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}
{%- endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
filter_commits = true
commit_parsers = [
  { message = "^build\\(deps", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^(build|refactor)", group = "<!-- 3 -->Under the hood" },
  { message = ".*", skip = true },
]
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
